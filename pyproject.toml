[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-token-audit"
version = "0.1.0"
description = "Trace your Claude Code cache-read bill back to what caused it."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.scripts]
cc-token-audit = "cc_token_audit.cli:main"

[tool.setuptools]
packages = ["cc_token_audit"]
